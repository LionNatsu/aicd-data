name: Notify AICD

on:
  push:
    tags: ['v*']

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger AICD rebuild
        env:
          GH_TOKEN: ${{ secrets.PAT_AICD_DISPATCH }}
        run: |
          gh api repos/LionNatsu/aicd/dispatches \
            -f event_type=aicd-data-updated \
            -f client_payload[ref]="${{ github.ref_name }}"
